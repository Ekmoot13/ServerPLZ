# docker-compose.local.yml — środowisko DEWELOPERSKIE na Twoim komputerze.
# Postgres + web (Next/Payload) z hot-reloadem na http://localhost:3000.
# Bez Caddy i backendu. Sekrety są lokalne/atrapowe — to tylko dev.
#
# Start:   docker compose -f docker-compose.local.yml up
# Stop:    docker compose -f docker-compose.local.yml down   (dane bazy zostają w wolumenie)

name: plz-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plz
      POSTGRES_USER: plz_user
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pg_local:/var/lib/postgresql/data

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install --include=dev && npm run dev"
    environment:
      DATABASE_URL: postgres://plz_user:localdev@postgres:5432/plz
      PAYLOAD_SECRET: local-dev-secret-change-me
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: local-cron
      PREVIEW_SECRET: local-preview
      PORT: "3000"
      # Wymuszenie pollingu — Windows+Docker nie wysyła zdarzeń o zmianie plików przez wolumen
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_HLS_URL: http://localhost:8888
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_local_node_modules:/app/node_modules
      - web_local_next:/app/.next
    depends_on:
      - postgres

  # Serwer mediów: RTMP (nadawanie z kamer) -> HLS (odtwarzanie w przeglądarce)
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./streaming-project/mediamtx/mediamtx.yml:/mediamtx.yml

volumes:
  pg_local:
  web_local_node_modules:
  web_local_next:
